name: prep-upstream-pr

on:
  push:
    paths:
      - .github/workflows/prep-upstream-pr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean branch on top of upstream main
        run: |
          set -eux
          git fetch --no-tags https://github.com/Mercury000/xiaoaiisland.git main:refs/remotes/upstream/main
          git checkout -B clean-wakeup refs/remotes/upstream/main
          curl -fsSL https://raw.githubusercontent.com/wangjianghe-h/xiaoaiisland/908979579c6845217de32ce5c76a1a4d8a34e025/app/src/main/java/com/xiaoai/islandnotify/hook/DeskClockHook.java -o /tmp/fixed.java
          python3 - <<'PY'
          import re, io
          s = io.open('/tmp/fixed.java', encoding='utf-8').read().replace('\r\n', '\n')
          s = re.sub(r'    /\*\* DeskClockHook 就绪后反向通知.*?private static final String MAIN_PKG = "com\.miui\.voiceassist";\n\n', '', s, flags=re.S)
          s = re.sub(r'                        try \{\n                            Intent ready = new Intent\(ACTION_CLOCK_READY\);.*?                        \} catch \(Throwable ignored\) \{\n                        \}\n', '', s, flags=re.S)
          assert 'ACTION_CLOCK_READY' not in s
          assert len(s) == 23794, len(s)
          io.open('app/src/main/java/com/xiaoai/islandnotify/hook/DeskClockHook.java', 'w', encoding='utf-8', newline='\n').write(s)
          PY
          git add app/src/main/java/com/xiaoai/islandnotify/hook/DeskClockHook.java
          git -c user.name="YUN GU" -c user.email="379567382@qq.com" commit -m "feat(wakeup): 规则表节次回退 + 持久化叫醒日志"
          git --no-pager show --stat --oneline HEAD
          git push origin clean-wakeup --force